services:
  app:
    build:
      context: .
      dockerfile: docker/${APP_ENV:-local}/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
    ports:
      # Bound to loopback, not 0.0.0.0. On a server the container sits behind a reverse proxy
      # and must not answer the public interface directly, or the app is reachable over plain
      # HTTP beside the proxy, where a service worker cannot register. Override APP_BIND to
      # 0.0.0.0 only when something on the LAN genuinely needs to reach it.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:5173
    depends_on:
      - app
    profiles:
      - tunnel

volumes:
  node_modules:
