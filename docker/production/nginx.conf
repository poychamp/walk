server {
    # 5173, not 80. The one docker-compose.yml maps ${APP_PORT:-5173}:5173 for every
    # environment, and there is no second compose file to special case this one.
    listen 5173;
    listen [::]:5173;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Audio is served byte range. Safari issues range requests for media and nginx answers
    # them natively for static files, which is the whole reason the service worker was kept
    # out of the audio path rather than taught to proxy ranges.
    #
    # gzip must never touch audio. nginx drops range support on anything it compresses on the
    # fly, so a compressed mp3 would break seeking and resume with no error anywhere.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # A missing audio file returns 404 rather than index.html. Without this the SPA fallback
    # below hands back an HTML page with a 200, and a media element failing on an HTML body
    # is a genuinely hard thing to read from the outside.
    location /audio/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Hashed by Vite, so the name changes whenever the content does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Copied verbatim out of public/, so these names are stable and the content can change
    # under them. A week is long enough to be free on a walk and short enough to fix.
    location ~* ^/(fonts|icons)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # The service worker and its registration must revalidate every load. Cache either one and
    # the app pins itself to an old build on the device with no way to push a fix.
    location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # default_type rather than a types block, which would warn about a duplicate extension on
    # nginx builds that already map webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # index.html is never cached. It is the file that names the current hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # There is no client router in this app, so this is only here for a deep link or a stale
    # bookmark. Everything real is served above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
